# Builds, signs and publishes Zebu Desktop for macOS, Windows and Linux.
#
# Trigger: push a tag `vX.Y.Z` (see docs/release.md). The tag must match the
# version in src-tauri/tauri.conf.json. Every platform build attaches its
# installers and signed updater artifacts to one draft GitHub Release; the
# `publish` job then puts the same files in the Cloudflare R2 bucket behind
# https://app-downloads.zebu.work, which is where the in-app updater and the
# downloads page actually read from. (The repository is private, so a GitHub
# release asset is a 404 for an installed copy of the app — which is why the
# updater has never worked. Signing, not the host, is what protects an
# update: the app verifies a minisign signature before installing, so serving
# the files publicly gives nothing away.)
#
# `workflow_dispatch` runs the same build and the same publish without
# creating a release and without touching anything real: it writes to
# `desktop/_dryrun/<run id>/` instead of `desktop/`. One variable is the only
# difference, so the rehearsal exercises the credentials, the endpoint, the
# bucket permissions, the upload ordering and the public URLs.
#
# Nothing in this workflow deletes anything from the bucket. Scratch objects
# under `desktop/_dryrun/` are expired by a bucket lifecycle rule.
#
# Code signing is optional and switched on purely by which secrets exist:
#   macOS   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#           APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID       → Developer ID + notarization
#   Windows AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#           AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_CODE_SIGNING_NAME,
#           AZURE_CERT_PROFILE_NAME                        → Azure Trusted Signing
#   updater TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (required)
#
# Publishing needs R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY
# (an R2 API token scoped to the `app-downloads` bucket, Object Read & Write).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Where the built files are served from. The updater endpoint in
  # src-tauri/tauri.conf.json must agree with this.
  R2_BUCKET: app-downloads
  PUBLIC_BASE: https://app-downloads.zebu.work

jobs:
  verify:
    name: Version and release scripts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The manifest builder and the R2 publisher decide what every installed
      # copy of the app is told to download. Neither can be rehearsed by
      # cutting a release, so they are tested here, before anything builds.
      - name: Test the release scripts
        run: bash scripts/tests/publish-r2.test.sh

      - name: Compare tag with tauri.conf.json and package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016  # the JS below is deliberately unexpanded
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            if (tag !== tauri || tag !== pkg) {
              console.error(`Tag v${tag} does not match tauri.conf.json (${tauri}) / package.json (${pkg}).`);
              process.exit(1);
            }
            console.log(`Releasing ${tag}`);
          '

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: blacksmith-6vcpu-macos-15
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64)
            platform: blacksmith-4vcpu-windows-2025
            rust_targets: x86_64-pc-windows-msvc
            args: ''
          - name: Linux (x86_64)
            platform: blacksmith-4vcpu-ubuntu-2204
            rust_targets: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Secrets cannot be read inside `if:`; mirror their presence into env.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libxss-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Test and lint
        run: |
          npm test
          npm run lint

      # Windows: Azure Trusted Signing signs the binary, the MSI and the NSIS
      # installer through Tauri's bundle.windows.signCommand. The overlay
      # config is generated here so the account details live in secrets.
      - name: Prepare Windows code signing (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          cargo install trusted-signing-cli --locked
          $config = @{
            bundle = @{
              windows = @{
                signCommand = "trusted-signing-cli -e $env:ENDPOINT -a $env:ACCOUNT -c $env:PROFILE %1"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.windows-signing.conf.json -Value $config
          Write-Host "Windows binaries will be signed with Azure Trusted Signing ($env:ACCOUNT / $env:PROFILE)."

      - name: Note unsigned Windows build
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING != 'true'
        run: echo "::warning::No Windows signing secrets configured — installers will trigger a SmartScreen notice. See docs/release.md."

      - name: Note unsigned macOS build
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING != 'true'
        run: echo "::warning::No Apple signing secrets configured — the .dmg will be unsigned and Gatekeeper will refuse it by default. See docs/release.md."

      # Fail in seconds, not after ten minutes of compiling, when the updater
      # key is missing or malformed. Secrets live per repository: the ones on a
      # fork or an old copy of this repo are invisible here.
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on $GITHUB_REPOSITORY (Settings → Secrets and variables → Actions). See docs/release.md."
            exit 1
          fi
          # `tauri signer generate` writes the key as one base64 line whose decoded
          # form is a minisign box starting with "untrusted comment:". Accept the
          # file content as written (also with stray whitespace/newlines).
          decoded=$(printf '%s' "$TAURI_KEY" | tr -d ' \n\r' | { base64 -d 2>/dev/null || base64 -D 2>/dev/null; } | head -c 200 || true)
          case "$decoded" in
            "untrusted comment:"*) echo "updater key present" ;;
            *) echo "::error::TAURI_SIGNING_PRIVATE_KEY does not decode to an updater key. Set it to the exact content of the file written by 'npm run tauri signer generate' (gh secret set TAURI_SIGNING_PRIVATE_KEY -R $GITHUB_REPOSITORY < ~/.tauri/zebu-desktop.key)."; exit 1 ;;
          esac

      # Only hand the Apple variables to tauri when they are set: an empty
      # APPLE_CERTIFICATE still makes the bundler try (and fail) to sign.
      - name: Export Apple signing secrets
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is empty while APPLE_CERTIFICATE is set — all six Apple secrets are needed."; exit 1; fi
            # strip any newlines a base64 export may have wrapped in
            value="$(printf '%s' "$value" | tr -d '\n\r')"
            printf '%s<<__EOF__\n%s\n__EOF__\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          echo "Apple signing enabled for $APPLE_SIGNING_IDENTITY"

      - name: Build and publish with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater artifacts (.sig files + latest.json) — required
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization: APPLE_* come from the
          # "Export Apple signing secrets" step above, only when configured.
          # Windows Azure Trusted Signing credentials (read by trusted-signing-cli)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          # On a tag: create/append to the draft release for that tag. On a
          # manual run there is no tag, so tauri-action only builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Zebu {0}', github.ref_name) || '' }}
          releaseBody: |
            Zebu Desktop ${{ github.ref_name }} — menubar time tracker for your Zebu workspace.

            **macOS 11+** `Zebu_<version>_universal.dmg` · **Windows 10+ (x64)** `Zebu_<version>_x64-setup.exe` or `.msi` · **Linux (x86_64)** `.AppImage`, `.deb` or `.rpm`.
            Existing installs update themselves via `latest.json`.
          releaseDraft: true
          prerelease: false
          # NOTE: this attaches a latest.json to the GitHub release whose URLs
          # point at GitHub release assets. The app does NOT read it — its
          # endpoint is app-downloads.zebu.work, and on a private repository
          # those URLs are a 404 anyway. The one the app reads is built by
          # scripts/updater-manifest.mjs in the `publish` job below. Left on
          # only because turning it off is a change to the tauri-action call
          # that a release cannot rehearse; it is dead weight, not a fallback.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ (runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true') && '--config src-tauri/tauri.windows-signing.conf.json' || '' }}

      # Always, now: the publish job downloads these rather than reading the
      # GitHub release, so the same handful of files reaches R2 on a real
      # release and on a dry run. `if-no-files-found: error` because a build
      # that produced nothing must not quietly become a publish of nothing.
      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zebu-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.tar.gz*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  # ---------------------------------------------------------------------------
  # Publish to Cloudflare R2
  # ---------------------------------------------------------------------------
  # This is what installed copies of the app read. It runs on both paths; the
  # only difference is DEST_BASE:
  #
  #   tag              desktop/            -> desktop/<version>/…,
  #                                          desktop/latest/…, desktop/latest.json
  #   workflow_dispatch  desktop/_dryrun/<run id>/  -> the same three, under there
  #
  # Everything else — credentials, endpoint, ordering, read-back, the public
  # HTTPS check — is one code path, so a dry run proves the route a release
  # will take. A dry run cannot write desktop/latest.json, desktop/latest/* or
  # a real version folder; scripts/publish-r2.sh refuses any other --base and
  # scripts/tests/publish-r2.test.sh holds it to that.
  publish:
    name: Publish to R2
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # The one variable that separates a release from a rehearsal.
      DEST_BASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop' || format('desktop/_dryrun/{0}', github.run_id) }}
      # Pinned: the AWS CLI decides how every object is written (checksums,
      # multipart thresholds, metadata), and an unannounced change there is a
      # broken release found at the worst moment. The versioned installer URL
      # is immutable, so the checksum below pins the exact bytes.
      AWS_CLI_VERSION: 2.36.43
      AWS_CLI_SHA256: ef606eb55f9a93ac404cc4a6869c0a791c234b898d93ec6af3bba8c491b391e9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the R2 credentials are present
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are not set on $GITHUB_REPOSITORY. The updater reads $PUBLIC_BASE, so a release that cannot publish there is not a release. See docs/release.md."
            exit 1
          fi

      - name: Install the AWS CLI (pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip"
          echo "${AWS_CLI_SHA256}  awscliv2.zip" | sha256sum -c -
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - uses: actions/download-artifact@v4
        with:
          pattern: zebu-desktop-*
          path: artifacts

      # One flat directory: the bucket layout is flat under the version, and
      # the manifest builder reads a directory rather than a bundle tree. Two
      # platforms producing the same file name would silently overwrite one
      # another, so that is an error rather than a coin toss.
      - name: Collect the bundles into one directory
        run: |
          mkdir -p upload
          count=0
          while IFS= read -r file; do
            name=$(basename -- "$file")
            if [ -e "upload/$name" ]; then
              echo "::error::two builds produced a file called $name"
              exit 1
            fi
            cp -- "$file" "upload/$name"
            count=$((count + 1))
          done < <(find artifacts -type f | sort)
          if [ "$count" = 0 ]; then
            echo "::error::no bundles were downloaded — nothing to publish"
            exit 1
          fi
          echo "$count files to publish:"
          ls -l upload

      - name: Build the updater manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --dir upload \
            --base-url "$PUBLIC_BASE/$DEST_BASE/$VERSION" \
            --notes "Zebu Desktop $VERSION" \
            --aliases-out aliases.tsv \
            > latest.json
          echo "latest.json:"
          cat latest.json
          echo "aliases:"
          cat aliases.tsv

      # Versioned files, then the aliases, then the manifest — see
      # scripts/publish-r2.sh. The endpoint carries the account id and is
      # passed through the environment, never on a command line; no `set -x`
      # anywhere on this path.
      - name: Publish to R2 and read it back
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # R2 rejects the trailing checksum headers the CLI adds by default
          # on some paths; "when_required" is the S3-compatible behaviour.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          scripts/publish-r2.sh publish \
            --bucket "$R2_BUCKET" \
            --base "$DEST_BASE" \
            --version "$VERSION" \
            --dir upload \
            --manifest latest.json \
            --aliases aliases.tsv \
            --public-base "$PUBLIC_BASE"

      - name: Summarise
        run: |
          {
            if [ "$DEST_BASE" = desktop ]; then
              echo "### Published Zebu Desktop $VERSION"
              echo
              echo "- manifest: \`$PUBLIC_BASE/desktop/latest.json\`"
              echo "- this build: \`$PUBLIC_BASE/desktop/$VERSION/\` (kept forever)"
              echo "- download aliases: \`$PUBLIC_BASE/desktop/latest/\`"
            else
              echo "### Dry run — nothing real was written"
              echo
              echo "Everything went to \`$DEST_BASE/\`: the same code, credentials and ordering as a release."
              echo
              echo "- manifest: \`$PUBLIC_BASE/$DEST_BASE/latest.json\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
