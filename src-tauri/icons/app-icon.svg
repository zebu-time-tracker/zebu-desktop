<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source of every desktop app icon size (board #422, #523): regenerate with
       `npx tauri icon src-tauri/icons/app-icon.svg`, then put back the iOS and
       Android sets (git checkout src-tauri/icons/ios src-tauri/icons/android):
       those platforms mask the icon themselves and want it full-bleed.
       The Zebu mark exactly as in the web app's favicon (board #495: bolder
       diagonal, larger Z) on the app's green, laid out on Apple's macOS grid:
       an 824px rounded body centred in the 1024px canvas, with room for the
       soft shadow below. Never full-bleed: the Dock shows a square tile as a
       bigger, sharper icon than every other app (board #523). -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#16a34a" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(0.80626)">
    <g transform="translate(511 511) scale(1.22) translate(-511 -514.6)">
      <line x1="700.463" y1="748.512" x2="330.463" y2="282.512" stroke-width="70" stroke="#fff" opacity="0.7"/>
      <path fill="#fff" d="M300.309 802V741.33L631.599 259.962L657.144 296.683H309.889V227.232H713.823V287.902L384.13 767.674L359.383 732.549H720.209V802H300.309Z"/>
    </g>
  </g>
</svg>
