[package]
name = "zebu-desktop"
version = "0.1.13"
description = "Zebu menubar time tracker"
homepage = "https://zebu.work"
authors = ["Alan Woo"]
edition = "2021"
license = "MIT"

[lib]
name = "zebu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# signed auto-updates from the GitHub release's latest.json, and relaunch after installing one
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# system-wide hotkeys for start/stop, the popover and insights (see set_shortcut)
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# menubar pill rendering (play/pause + elapsed time drawn as the tray icon)
tiny-skia = "0.11"
ab_glyph = "0.2"
user-idle = "0.6.0"
# live timer updates: the Reverb socket lives on a native task (see src/live.rs)
tokio = { version = "1", features = ["time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }

# focus tracking (board #401): the frontmost app and its window title
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
