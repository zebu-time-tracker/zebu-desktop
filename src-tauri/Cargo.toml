[package]
name = "zebu-desktop"
version = "0.1.0"
description = "Zebu menubar time tracker"
authors = ["Alan Woo"]
edition = "2021"

[lib]
name = "zebu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# menubar pill rendering (play/pause + elapsed time drawn as the tray icon)
tiny-skia = "0.11"
ab_glyph = "0.2"
user-idle = "0.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
